<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar usuário | Hotel Pet</title>

    <link rel="stylesheet" href="cadastrar-usuario.css">
</head>

<body>
    <div class="painel">
        <aside class="menu-lateral">
            <a class="logo" href="reservas.html">Hotel Pet</a>

            <nav aria-label="Menu principal">
                <ul>
                    <li><a href="pets.html">🐾 Pets</a></li>
                    <li><a class="ativo" href="usuarios.html">♙ Usuários</a></li>
                    <li><a href="configuracoes.html">⚙ Configurações</a></li>
                    <li><a href="reservas.html">▣ Reservas</a></li>
                </ul>
            </nav>
        </aside>

        <div class="conteudo">
            <header class="cabecalho">
                <a href="editar-perfil.html" class="perfil">
                    <span class="foto-perfil">👤</span>
                    João da Silva
                </a>
            </header>

            <main>
                <p class="caminho">
                    <a href="reservas.html">Home</a> /
                    <a href="usuarios.html">Usuários</a> /
                    Novo usuário
                </p>

                <section class="cartao" aria-labelledby="titulo-cadastro">
                    <h1 id="titulo-cadastro">Cadastrar usuário</h1>

                    <form action="usuarios.html" method="get">
                        <div class="campo">
                            <label for="email">E-mail *</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Digite o e-mail"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="nome">Nome *</label>
                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                placeholder="Digite o nome"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="sobrenome">Sobrenome</label>
                            <input
                                type="text"
                                id="sobrenome"
                                name="sobrenome"
                                placeholder="Digite o sobrenome"
                            >
                        </div>

                        <div class="campo">
                            <label for="telefone">Telefone *</label>
                            <input
                                type="tel"
                                id="telefone"
                                name="telefone"
                                placeholder="+55 (00) 00000-0000"
                                required
                            >
                        </div>

                        <div class="campo">
                            <label for="funcao">Função *</label>
                            <select id="funcao" name="funcao" required>
                                <option value="">Selecione uma função</option>
                                <option value="cliente">Cliente</option>
                                <option value="funcionario">Funcionário</option>
                                <option value="gerente">Gerente</option>
                            </select>
                        </div>

                        <div class="campo">
                            <label for="foto">Foto</label>
                            <input
                                type="file"
                                id="foto"
                                name="foto"
                                accept="image/*"
                            >
                        </div>

                        <div class="acoes">
                            <button class="botao-salvar" type="submit">
                                💾 Salvar
                            </button>

                            <button class="botao-limpar" type="reset">
                                ↻ Limpar
                            </button>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
