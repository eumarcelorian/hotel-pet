<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | Hotel Pet</title>

    <link rel="stylesheet" href="criar-conta.css">
</head>

<body>
    <main>
        <section aria-labelledby="titulo-criar-conta">
            <!-- Imagem principal -->
            <div>
                <img
                    src="imagens/hotel-pet-cadastro.jpg"
                    alt="Animais hospedados no Hotel Pet"
                >
            </div>

            <!-- Área de criação da conta -->
            <div>
                <header>
                    <h1 id="titulo-criar-conta">Hotel Pet</h1>
                    <p>Crie uma conta para acessar o sistema.</p>
                </header>

                <form action="index.html" method="get">
                    <div>
                        <label for="login">Login</label>
                        <input
                            type="text"
                            id="login"
                            name="login"
                            placeholder="Digite seu login"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div>
                        <label for="senha">Senha</label>
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >
                    </div>

                    <button type="submit">Criar conta</button>
                </form>

                <footer>
                    <p>
                        Já tem conta?
                        <a href="index.html">Login</a>
                    </p>
                </footer>
            </div>
        </section>
    </main>
</body>
</html>
