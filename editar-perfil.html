<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Perfil | Hotel Pet</title>

    <link rel="stylesheet" href="editar-perfil.css">
</head>

<body>
    <header>
        <h1>Hotel Pet</h1>

        <div>
            <img
                src="imagens/icone-usuario.png"
                alt="Foto de perfil de João da Silva"
            >
            <span>João da Silva</span>
        </div>
    </header>

    <aside>
        <nav aria-label="Menu principal">
            <ul>
                <li>
                    <a href="pets.html">Pets</a>
                </li>
                <li>
                    <a href="reservas.html">Reservas</a>
                </li>
            </ul>
        </nav>
    </aside>

    <main>
        <nav aria-label="Navegação estrutural">
            <p>
                <a href="reservas.html">Home</a> /
                Editar Perfil
            </p>
        </nav>

        <section aria-labelledby="titulo-editar-perfil">
            <h2 id="titulo-editar-perfil">Editar Perfil</h2>

            <form action="reservas.html" method="get">
                <div>
                    <label for="email">E-mail *</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="joaodasilva@pet.com"
                        required
                    >
                </div>

                <div>
                    <label for="nome">Nome *</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        value="João"
                        required
                    >
                </div>

                <div>
                    <label for="sobrenome">Sobrenome</label>
                    <input
                        type="text"
                        id="sobrenome"
                        name="sobrenome"
                        value="da Silva"
                    >
                </div>

                <div>
                    <label for="telefone">Telefone *</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        value="+55 (73) 99876-8943"
                        required
                    >
                </div>

                <div>
                    <p>Foto</p>

                    <img
                        src="imagens/joao-da-silva.jpg"
                        alt="Foto atual de João da Silva"
                    >

                    <label for="foto">Alterar foto</label>
                    <input
                        type="file"
                        id="foto"
                        name="foto"
                        accept="image/*"
                    >
                </div>

                <div>
                    <button type="submit">Salvar</button>
                    <button type="reset">Limpar</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
