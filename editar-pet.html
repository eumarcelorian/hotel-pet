<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Pet | Hotel Pet</title>

    <link rel="stylesheet" href="editar-pet.css">    
</head>

<body>
    <header>
        <h1>Hotel Pet</h1>

        <div>
            <img
                src="imagens/icone-usuario.png"
                alt="Foto de perfil de João da Silva"
            >
            <span>João da Silva</span>
        </div>
    </header>

    <aside>
        <nav aria-label="Menu principal">
            <ul>
                <li>
                    <a href="pets.html">Pets</a>
                </li>
                <li>
                    <a href="reservas.html">Reservas</a>
                </li>
            </ul>
        </nav>
    </aside>

    <main>
        <nav aria-label="Navegação estrutural">
            <p>
                <a href="reservas.html">Home</a> /
                <a href="pets.html">Pet</a> /
                Editar Pet
            </p>
        </nav>

        <section aria-labelledby="titulo-editar-pet">
            <h2 id="titulo-editar-pet">Editar Pet</h2>

            <form action="pets.html" method="get">
                <div>
                    <label for="nome">Nome *</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        value="Thor"
                        required
                    >
                </div>

                <div>
                    <label for="tipo">Tipo *</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Selecione o tipo</option>
                        <option value="cachorro" selected>Cachorro</option>
                        <option value="gato">Gato</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div>
                    <label for="raca">Raça *</label>
                    <input
                        type="text"
                        id="raca"
                        name="raca"
                        value="Golden Retriever"
                        required
                    >
                </div>

                <div>
                    <label for="tamanho">Tamanho *</label>
                    <select id="tamanho" name="tamanho" required>
                        <option value="">Selecione o tamanho</option>
                        <option value="pequeno">Pequeno</option>
                        <option value="medio" selected>Médio</option>
                        <option value="grande">Grande</option>
                    </select>
                </div>

                <div>
                    <p>Imagem</p>

                    <img
                        src="imagens/thor.jpg"
                        alt="Foto atual do pet Thor"
                    >

                    <label for="imagem">Alterar imagem</label>
                    <input
                        type="file"
                        id="imagem"
                        name="imagem"
                        accept="image/*"
                    >
                </div>

                <div>
                    <button type="submit">Salvar</button>
                    <button type="reset">Limpar</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
