<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pets | Hotel Pet</title>

    <link rel="stylesheet" href="pets.css">
</head>

<body>
    <header>
        <h1>Hotel Pet</h1>

        <div>
            <img
                src="imagens/icone-usuario.png"
                alt="Foto de perfil de João da Silva"
            >
            <span>João da Silva</span>
        </div>
    </header>

    <aside>
        <nav aria-label="Menu principal">
            <ul>
                <li>
                    <a href="pets.html">Pets</a>
                </li>
                <li>
                    <a href="reservas.html">Reservas</a>
                </li>
            </ul>
        </nav>
    </aside>

    <main>
        <nav aria-label="Navegação estrutural">
            <p>
                <a href="reservas.html">Home</a> / Pets
            </p>
        </nav>

        <section aria-labelledby="titulo-pets">
            <h2 id="titulo-pets">Pets</h2>

            <p>
                <a href="cadastrar-pet.html">+ Novo Pet</a>
            </p>

            <form action="pets.html" method="get">
                <fieldset>
                    <legend>Pesquisar pets</legend>

                    <div>
                        <label for="id">Id</label>
                        <input type="text" id="id" name="id">
                    </div>

                    <div>
                        <label for="raca">Raça</label>
                        <input type="text" id="raca" name="raca">
                    </div>

                    <div>
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome">
                    </div>

                    <div>
                        <label for="tamanho">Tamanho</label>
                        <input type="text" id="tamanho" name="tamanho">
                    </div>

                    <button type="submit">Pesquisar</button>
                    <button type="reset">Limpar</button>
                </fieldset>
            </form>

            <table>
                <thead>
                    <tr>
                        <th scope="col">Selecionar</th>
                        <th scope="col">Id</th>
                        <th scope="col">Nome</th>
                        <th scope="col">Tipo</th>
                        <th scope="col">Raça</th>
                        <th scope="col">Tamanho</th>
                        <th scope="col">Ações</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>
                            <input
                                type="checkbox"
                                id="pet-max"
                                name="pet-selecionado"
                                value="12349984501"
                            >
                            <label for="pet-max">Selecionar Max</label>
                        </td>
                        <td>12349984501</td>
                        <td>Max</td>
                        <td>Cachorro</td>
                        <td>Pastor Alemão</td>
                        <td>Grande</td>
                        <td>
                            <a href="editar-pet.html">Editar</a>
                            <a href="visualizar-pet.html">Visualizar</a>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <input
                                type="checkbox"
                                id="pet-ginger"
                                name="pet-selecionado"
                                value="12349984502"
                            >
                            <label for="pet-ginger">Selecionar Ginger</label>
                        </td>
                        <td>12349984502</td>
                        <td>Ginger</td>
                        <td>Gato</td>
                        <td>Não definida</td>
                        <td>Pequeno</td>
                        <td>
                            <a href="editar-pet.html">Editar</a>
                            <a href="visualizar-pet.html">Visualizar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
